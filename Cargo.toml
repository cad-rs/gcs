[package]
name = "rcad-gcs"
version = "0.2.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Standalone geometric constraint solver (GCS): 2D sketch, 3D geometric, and 3D rigid-pose constraint systems over one Newton-Raphson least-squares core"
readme = "README.md"
repository = "https://github.com/cad-rs/gcs"
homepage = "https://github.com/cad-rs/gcs"
documentation = "https://docs.rs/rcad-gcs"
keywords = ["geometry", "constraint-solver", "cad", "sketch", "newton-raphson"]
categories = ["mathematics", "science"]
# Library crate: ship the sources, the test corpus and the license texts.
include = [
    "src/**/*",
    "tests/**/*",
    "benches/**/*",
    "README.md",
    "ROADMAP.md",
    "CHANGELOG.md",
    "LICENSE",
    "LICENSE-MIT",
    "LICENSE-APACHE",
]

[features]
default = []
# Serializable constraint/sketch data types (off by default: the solver core
# stays dependency-free beyond glam).
serde = ["dep:serde", "glam/serde"]
# Solve the connected components of a system on several threads (rayon's
# global pool). Results are bitwise those of the sequential solve.
rayon = ["dep:rayon"]

[dependencies]
glam = "0.29"
serde = { version = "1.0", features = ["derive"], optional = true }
rayon = { version = "1.10", optional = true }

[dev-dependencies]
approx = "0.5"
serde_json = "1.0"
# Benchmarks only. Plotting and rayon are left out to keep the dev build small.
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "solve"
harness = false

[lints.clippy]
# The dense kernels index several matrices with the same loop variable
# (`a[i][k] -= a[col][k] * factor`); iterator rewrites of those loops are
# harder to check against the textbook form, not easier.
needless_range_loop = "allow"

# This crate is the workspace root: the empty table keeps `cargo` from
# walking up into a parent workspace when it is vendored or checked out
# inside another tree.
[workspace]
